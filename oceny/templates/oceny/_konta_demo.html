<div class="konta-lista">
  {% for k in konta %}{% if k.pk != user.pk %}
    <form method="post" action="{% url 'demo_zaloguj' %}">{% csrf_token %}
      <input type="hidden" name="login" value="{{ k.username }}">
      <button class="drugorzedny" type="submit">
        <span><strong>{{ k.get_full_name|default:k.username }}</strong>{% if k.pracownik %}<small>{{ k.pracownik.stanowisko }}</small>{% endif %}</span>
        {% include "oceny/_ikona.html" with ikona="strzalka" %}
      </button>
    </form>
  {% endif %}{% endfor %}
</div>
