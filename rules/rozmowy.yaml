# Przygotowanie do rozmów. Agenda wynika z przepisów (przypisy do wzorów arkuszy), pytania i karty to podpowiedzi,
# które urząd może edytować bez zmiany kodu.
rozpoczynajaca:
  nazwa: Rozmowa rozpoczynająca (wyznaczenie kryteriów)
  podstawa: § 5 ust. 1 rozporządzenia
  cel: Wspólne zrozumienie obowiązków, kryteriów i oczekiwań na cały okres oceny.
  agenda:
    - temat: Główne obowiązki wynikające z opisu stanowiska pracy
      pytania: ["Które obowiązki zajmują Ci najwięcej czasu?", "Czy opis stanowiska odpowiada temu, co faktycznie robisz?"]
    - temat: Kryteria obowiązkowe i dodatkowe
      pytania: ["Które kryterium będzie najważniejsze w Twojej pracy w tym okresie i dlaczego?"]
    - temat: Oczekiwania oceniającego co do sposobu spełniania kryteriów
      pytania: ["Jak będzie wyglądało dobre wykonanie tego zadania za rok?", "Po czym oboje poznamy, że oczekiwanie jest spełnione?"]
    - temat: Cele i sposób ich realizacji (jeżeli ich wyznaczenie jest uzasadnione)
      pytania: ["Jaki jeden cel rozwojowy chcesz osiągnąć w tym okresie?", "Jakiego wsparcia potrzebujesz?"]
  wskazowki:
    - Zapisz uzgodnione oczekiwania prostym językiem; wrócicie do nich przy rozmowie oceniającej.
    - Kryteria dodatkowe wybieraj pod faktyczne zadania, nie „na zapas”.
  wskazowki_ocenianego:
    - Przejrzyj opis swojego stanowiska i zastanów się, które obowiązki zajmują Ci najwięcej czasu.
    - Możesz zaproponować kryterium dodatkowe albo cel, który pasuje do Twoich zadań.
oceniajaca:
  nazwa: Rozmowa oceniająca
  podstawa: § 10 rozporządzenia
  cel: Omówienie okresu oceny na podstawie konkretnych przykładów i ustalenie kierunku rozwoju.
  agenda:
    - temat: Główne obowiązki wykonywane w okresie oceny i sposób ich realizacji, z uwzględnieniem kryteriów
      pytania: ["Który etap sprawy udało się skrócić i co pomogło?", "Które zadanie dało Ci najwięcej satysfakcji i dlaczego?"]
    - temat: Realizacja celów wyznaczonych na okres oceny (jeżeli zostały wyznaczone)
      pytania: ["Co pomogło, a co przeszkodziło w realizacji celu?"]
    - temat: Kierunki dalszego rozwoju zawodowego i potrzeby w zakresie podnoszenia kwalifikacji
      pytania: ["Czego chcesz się nauczyć w kolejnym okresie?", "Jakie nowe zadanie chcesz przejąć?"]
  wskazowki:
    - Zaczynaj od perspektywy ocenianego, potem dodaj swoje obserwacje z datami.
    - Oceny cząstkowe przyznajesz po rozmowie, biorąc pod uwagę jej wnioski (§ 11 ust. 2).
  wskazowki_ocenianego:
    - Przygotuj 2–3 przykłady zadań z okresu oceny: na czym polegało zadanie, jak je wykonano i jaki był skutek.
    - Pomyśl, czego potrzebujesz do dalszego rozwoju; to trafi do wniosków do IPRZ.
trudne_sytuacje:
  - tytul: Oceniany nie zgadza się z obserwacją
    kroki: ["Nazwij konkretną obserwację: kiedy, co się stało, jaki był skutek.", "Poproś o perspektywę ocenianego i wysłuchaj bez przerywania.", "Ustal, które fakty są wspólne, a co jest różnicą ocen.", "Uzgodnij jeden następny krok i termin sprawdzenia."]
  - tytul: Ocena może być negatywna
    kroki: ["Przygotuj przykłady do każdego kryterium z oceną 1 lub 3.", "Powiedz wprost o skutkach: ponowna ocena po 6 miesiącach od zapoznania (art. 81 ust. 9).", "Zaproponuj konkretne wsparcie do wniosków IPRZ.", "Poinformuj o prawie do sprzeciwu w 7 dni (art. 83 ust. 1)."]
  - tytul: Silne emocje w trakcie rozmowy
    kroki: ["Nazwij emocję bez oceniania: „Widzę, że to dla Ciebie trudne”.", "Zaproponuj przerwę albo kontynuację w innym terminie.", "Wróć do faktów i do tego, na co oceniany ma wpływ."]
  - tytul: Brak przykładów do kryterium
    kroki: ["Nie obniżaj oceny z powodu braku notatek.", "Zapytaj ocenianego o przykład z okresu oceny.", "Zapisz na przyszłość, jakie sytuacje warto obserwować."]
  - tytul: Oceniany mówi o przeciążeniu lub wypaleniu
    kroki: ["Podziękuj za otwartość; nie dopytuj o zdrowie.", "Ustal, które zadania można przekazać lub rozłożyć w czasie.", "Zapisz działanie w HR partnerze (odciążenie, rozmowa wspierająca) z datą sprawdzenia."]
biezacy_feedback:
  nazwa: Bieżąca informacja zwrotna (model sytuacja – zachowanie – skutek)
  kroki: ["Sytuacja: kiedy i gdzie.", "Zachowanie: co konkretnie zrobiła osoba (fakty, nie cechy).", "Skutek: jaki był efekt dla zespołu, interesantów lub zadania.", "Następny krok: co kontynuować albo zmienić."]
