# Wirtualny HR partner: reguły sygnałów i katalog działań. Edytowalne przez urząd (kadry) bez zmiany kodu.
# Sygnał to wskazówka do rozmowy, nie ocena ani decyzja. Brak wpisów oznacza brak danych.
wersja: "2026-11-21"

sygnaly:
  zmiany_priorytetu:
    zdarzenie: zmiana_priorytetu
    prog: 3
    okno_dni: 42
    tytul: "{n} zmiany priorytetu zadań w ciągu {tygodnie} tygodni"
    pytanie: "Który termin możemy wspólnie przesunąć?"
    obszar: organizacja pracy
    dzialania: [odciazenie, priorytety, rozmowa_wspierajaca]
  przyrost_zadan:
    zdarzenie: nowe_zadanie
    prog: 4
    okno_dni: 30
    tytul: "{n} nowe zadania w ciągu {dni} dni"
    pytanie: "Które z nowych zadań można przekazać komuś innemu albo rozłożyć w czasie?"
    obszar: obciążenie
    dzialania: [odciazenie, priorytety, mentoring, szkolenie]  # szkolenie: nowe zadania mogą oznaczać nowy zakres wiedzy
  powrot_po_nieobecnosci:
    # tylko fakt i okres nieobecności usprawiedliwionej; przyczyny nie są przetwarzane
    min_dni_nieobecnosci: 30
    okno_dni: 21  # pierwsze trzy tygodnie po powrocie
    tytul: "Powrót po {dni_nieobecnosci} dniach nieobecności"
    pytanie: "Co zmieniło się w zadaniach zespołu i czego potrzebujesz na start?"
    obszar: dobrostan
    dzialania: [rozmowa_wspierajaca, wdrozenie_po_powrocie, szkolenie]  # szkolenie: zmiany przepisów i procedur w czasie nieobecności
  osiagniecie_bez_docenienia:
    dni_bez_reakcji: 14
    tytul: "Osiągnięcie zgłoszone {data} czeka na docenienie"
    pytanie: "Jaki był skutek tego działania dla zespołu lub interesantów?"
    obszar: kultura doceniania
    dzialania: [docenienie]

dzialania:
  odciazenie: {nazwa: "Odciążenie: przekazanie lub przesunięcie zadania", opis: "Uzgodnij, które zadanie przechodzi do innej osoby albo dostaje późniejszy termin."}
  priorytety: {nazwa: "Wspólne ustalenie priorytetów", opis: "Krótka lista zadań w kolejności ważności na najbliższe tygodnie."}
  rozmowa_wspierajaca: {nazwa: "Rozmowa wspierająca", opis: "Rozmowa o obciążeniu i potrzebach, bez oceniania; ustalenie jednego kroku."}
  mentoring: {nazwa: "Mentoring", opis: "Wsparcie doświadczonej osoby z zespołu lub innej komórki."}
  szkolenie: {nazwa: "Szkolenie lub działanie rozwojowe", opis: "Uzupełnienie wiedzy potrzebnej do nowych lub zmienionych zadań; propozycje form w katalogu rozwoju (rules/rozwoj.yaml), do uwzględnienia we wnioskach do IPRZ przy najbliższej ocenie."}
  wdrozenie_po_powrocie: {nazwa: "Wdrożenie po powrocie", opis: "Przegląd zmian w zadaniach i procedurach, wskazanie osoby do kontaktu."}
  docenienie: {nazwa: "Docenienie", opis: "Konkretne podziękowanie: co zrobiono i jaki był skutek."}
  informacja_zwrotna: {nazwa: "Informacja zwrotna", opis: "Opis zachowania, jego skutku i oczekiwanego kolejnego kroku."}

rodzaje_zdarzen:
  nowe_zadanie: nowe zadanie
  zmiana_priorytetu: zmiana priorytetu
  zmiana_terminu: zmiana terminu
  przekazanie: przekazanie zadania innej osobie
  zakonczenie: zakończenie zadania
