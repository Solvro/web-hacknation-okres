# Uruchomienie jedną komendą: docker compose up --build
# Przed pierwszym startem: cp .env.example .env. Bez DJANGO_SECRET_KEY klucz zostanie wygenerowany na wolumenie.
services:
  okres:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Asystent AI (opcjonalny): tryb rozumowania modelu wyłączony, chyba że .env mówi inaczej
      OKRES_AI_THINK: ${OKRES_AI_THINK:-0}
    extra_hosts:
      # Ollama na hoście: OKRES_OLLAMA_URL=http://host.docker.internal:11434 (działa też na Linuksie)
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - okres-data:/app/data
    restart: unless-stopped

  # Scheduler procesu: przypomnienia o terminach i zakładanie kolejnych okresów oceny, raz na dobę.
  # Ten sam obraz i ta sama baza; alternatywnie cron hosta (DEPLOY.md).
  scheduler:
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - okres-data:/app/data
    depends_on:
      okres:
        condition: service_healthy
    command: ["sh", "-c", "while true; do python manage.py scheduler; sleep 86400; done"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  okres-data:
